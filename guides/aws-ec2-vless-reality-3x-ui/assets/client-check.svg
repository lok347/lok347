<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="客户端导入与成功验收检查示意图"><rect width="1000" height="270" rx="18" fill="#111827"/><text x="29" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="white">保存入站 → 导出 VLESS 分享链接 → 导入客户端 → 验收</text><g font-family="Arial, sans-serif"><rect x="30" y="66" width="446" height="173" rx="12" fill="#1E293B" stroke="#475569"/><text x="51" y="100" font-size="20" font-weight="700" fill="#93C5FD">客户端参数必须对应</text><g font-size="17" fill="#F1F5F9"><text x="51" y="135">Address：你自己的 EC2 公网 IP</text><text x="51" y="165">Port：443 · VLESS · REALITY</text><text x="51" y="195">Flow：xtls-rprx-vision · fp：chrome</text><text x="51" y="225">UUID、pbk、sid、SNI：按实际导出</text></g><rect x="498" y="66" width="472" height="173" rx="12" fill="#064E3B" stroke="#10B981"/><text x="523" y="100" font-size="20" font-weight="700" fill="#A7F3D0">确认成功（不要只看延迟）</text><g font-size="18" fill="#D1FAE5"><text x="523" y="137">✓ 已连通代理节点</text><text x="523" y="170">✓ 实际网站能正常打开</text><text x="523" y="203">✓ 出口 IP 对应你自己的 EC2</text></g></g></svg>
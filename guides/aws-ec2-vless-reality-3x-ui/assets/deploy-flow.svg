<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="176" viewBox="0 0 1080 176" role="img" aria-label="从 AWS EC2 到可用 VLESS 节点的六步流程示意图"><rect width="1080" height="176" rx="20" fill="#111827"/><text x="28" y="34" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#F9FAFB">六步完成部署 · 先走主线，后看附录</text><g font-family="Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><rect x="24" y="60" width="145" height="80" rx="12" fill="#1D4ED8"/><text x="96" y="90" fill="white">01  创建 EC2</text><text x="96" y="115" font-size="13" fill="#DBEAFE">获取公网 IP + PEM</text><rect x="200" y="60" width="145" height="80" rx="12" fill="#1E40AF"/><text x="272" y="90" fill="white">02  SSH 登录</text><text x="272" y="115" font-size="13" fill="#DBEAFE">Mac 终端</text><rect x="376" y="60" width="145" height="80" rx="12" fill="#1E40AF"/><text x="448" y="90" fill="white">03  安装 3x-ui</text><text x="448" y="115" font-size="13" fill="#DBEAFE">1 → n → 4 → y</text><rect x="552" y="60" width="145" height="80" rx="12" fill="#1E40AF"/><text x="624" y="90" fill="white">04  REALITY</text><text x="624" y="115" font-size="13" fill="#DBEAFE">注意版本输入</text><rect x="728" y="60" width="145" height="80" rx="12" fill="#1E40AF"/><text x="800" y="90" fill="white">05  导入客户端</text><text x="800" y="115" font-size="13" fill="#DBEAFE">Shadowrocket</text><rect x="904" y="60" width="150" height="80" rx="12" fill="#047857"/><text x="979" y="90" fill="white">06  验收</text><text x="979" y="115" font-size="13" fill="#D1FAE5">网站 + 出口 IP</text></g><g stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M174 100h18l-7 -7m7 7l-7 7"/><path d="M350 100h18l-7 -7m7 7l-7 7"/><path d="M526 100h18l-7 -7m7 7l-7 7"/><path d="M702 100h18l-7 -7m7 7l-7 7"/><path d="M878 100h18l-7 -7m7 7l-7 7"/></g></svg>
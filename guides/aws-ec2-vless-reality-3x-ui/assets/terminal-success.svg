<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Mac 终端 SSH 登录 Ubuntu 服务器示意"><rect width="1000" height="270" rx="18" fill="#101827"/><rect x="20" y="19" width="960" height="231" rx="12" fill="#0A0F19" stroke="#4B5563"/><circle cx="48" cy="46" r="7" fill="#F87171"/><circle cx="71" cy="46" r="7" fill="#FBBF24"/><circle cx="94" cy="46" r="7" fill="#34D399"/><text x="500" y="50" font-family="monospace" font-size="15" text-anchor="middle" fill="#94A3B8">Mac Terminal · SSH 示例</text><g font-family="monospace" font-size="20"><text x="42" y="105" fill="#6EE7B7">$</text><text x="62" y="105" fill="#E5E7EB"> chmod 400 "$EC2_KEY"</text><text x="42" y="145" fill="#6EE7B7">$</text><text x="62" y="145" fill="#E5E7EB"> ssh -i "$EC2_KEY" "ubuntu@$EC2_IP"</text><text x="42" y="190" fill="#93C5FD">ubuntu@ip-10-x-x-x:~$</text><text x="42" y="224" fill="#9CA3AF" font-size="15">出现 ubuntu@... 提示符代表已登录 EC2（示意）</text></g></svg>
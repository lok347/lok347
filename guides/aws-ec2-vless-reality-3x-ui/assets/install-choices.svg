<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" role="img" aria-label="3x-ui 安装器四次输入依次为 1、n、4、y"><rect width="980" height="250" rx="18" fill="#111827"/><text x="28" y="39" font-family="Arial, sans-serif" font-size="23" fill="#F9FAFB" font-weight="700">安装器关键输入：按出现的提示逐个输入，不要一次性粘贴</text><g font-family="Arial, sans-serif"><g transform="translate(24 61)"><rect width="218" height="149" rx="12" fill="#243044" stroke="#475569"/><text x="18" y="30" font-size="14" fill="#CBD5E1">Database Selection</text><text x="109" y="100" font-size="60" font-weight="800" fill="#93C5FD" text-anchor="middle">1</text><text x="109" y="128" font-size="16" fill="#F9FAFB" text-anchor="middle">SQLite</text></g><g transform="translate(261 61)"><rect width="218" height="149" rx="12" fill="#243044" stroke="#475569"/><text x="17" y="30" font-size="14" fill="#CBD5E1">Customize panel port?</text><text x="109" y="100" font-size="60" font-weight="800" fill="#93C5FD" text-anchor="middle">n</text><text x="109" y="128" font-size="16" fill="#F9FAFB" text-anchor="middle">随机生成端口</text></g><g transform="translate(498 61)"><rect width="218" height="149" rx="12" fill="#243044" stroke="#475569"/><text x="17" y="30" font-size="14" fill="#CBD5E1">SSL 四选一</text><text x="109" y="100" font-size="60" font-weight="800" fill="#FDBA74" text-anchor="middle">4</text><text x="109" y="128" font-size="16" fill="#F9FAFB" text-anchor="middle">跳过面板 SSL</text></g><g transform="translate(735 61)"><rect width="218" height="149" rx="12" fill="#243044" stroke="#475569"/><text x="17" y="30" font-size="14" fill="#CBD5E1">Bind to 127.0.0.1?</text><text x="109" y="100" font-size="60" font-weight="800" fill="#6EE7B7" text-anchor="middle">y</text><text x="109" y="128" font-size="16" fill="#F9FAFB" text-anchor="middle">仅 SSH 隧道访问</text></g></g></svg>